<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Archive</title>

    <!-- 테마 FOUC 방지: CSS보다 먼저 실행 -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('novel_archive_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
	
    <!-- 폰트: preconnect + 초기 필수 폰트만 (나머지는 JS가 lazy load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
	    <div class="brand">
            <button class="brand-icon" onclick="app.goToList()">N</button>
            <div id="globalStats" class="global-stats" title="모든 작품의 누적 통계">
                    <span class="stat-item"><span class="stat-label">누적 글자</span> <strong id="statChars">0</strong></span>
                    <span class="stat-sep">·</span>
                    <span class="stat-item"><span class="stat-label">누적 회차</span> <strong id="statChapters">0</strong></span>
            </div>
        </div>
				
        <div class="header-actions">
            <button onclick="app.openNewPostModal()" class="btn btn-primary">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                새 게시글
            </button>

            <button onclick="app.toggleDarkMode()" id="themeToggleBtn" class="btn-icon" title="테마 전환"></button>

            <button onclick="app.downloadJSON()" class="btn btn-soft">JSON 다운</button>
            <label class="btn btn-soft btn-file-label">
                JSON 복원
                <input type="file" accept=".json" onchange="app.restoreJSON(event)" hidden>
            </label>
			
            <button onclick="app.connectFile()" id="connectFileBtn" class="btn btn-success">
                📁 파일 연결
            </button>
            <button onclick="app.saveToFile()" id="saveFileBtn" class="btn btn-purple hidden" title="연결된 파일에 즉시 저장">
                💾 파일 저장
            </button>

        </div>
    </header>

    <main class="app-main">
        <div id="toastContainer" class="toast-container"></div>
        <div id="appView" class="app-view">
            <div class="view-loading">데이터를 불러오는 중입니다...</div>
        </div>
    </main>

    <div class="scroll-buttons">
        <div class="scroll-btn-grid">
            <button onclick="window.scrollTo({top:0})" class="scroll-btn" title="빠르게 맨 위로">▲</button>
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="scroll-btn" title="부드럽게 맨 위로">↑</button>
            <button onclick="window.scrollTo({top:document.body.scrollHeight})" class="scroll-btn" title="빠르게 맨 아래로">▼</button>
            <button onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})" class="scroll-btn" title="부드럽게 맨 아래로">↓</button>
        </div>

        <!-- 실시간 날짜/시간 표시 -->
        <div id="liveClock" class="live-clock">
            <div class="live-clock-date">-</div>
            <div class="live-clock-ampm">-</div>
            <div class="live-clock-time">--:--:--</div>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div id="modalContent" class="modal"></div>
    </div>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/preferences.js"></script>
<script src="js/file-sync.js"></script>
<script src="js/modal.js"></script>
<script src="js/list-view.js"></script>
<script src="js/detail-view.js"></script>
<script src="js/chapter-edit.js"></script>
<script src="js/setting-edit.js"></script>
<script src="js/app.js"></script>

</body>
</html>
