<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 백업 관리 - Pastel Theme</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
	
    <!-- Google Fonts & Web Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ridenote/ridibatang/ridibatang.css">
    
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col transition-colors duration-200">

    <header class="sticky top-0 z-30 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="app.goToList()">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#f8b195] to-[#f8c8dc] dark:from-amber-600 dark:to-purple-800 flex items-center justify-center font-bold text-white shadow">N</div>
            <h1 class="text-xl font-bold tracking-tight font-gowunbatang text-[#3d3b40] dark:text-[#e5c07b] flex items-center gap-2">
                Novel Archive <span class="text-xs px-2 py-0.5 rounded bg-white/70 dark:bg-gray-800/70 text-gray-600 dark:text-gray-400 font-normal border border-[#f0e6ed] dark:border-gray-700">v2.8</span>
            </h1>
        </div>
        <div class="flex items-center space-x-2 flex-wrap gap-y-2">
            <button onclick="app.openNewPostModal()" class="flex items-center gap-2 bg-gradient-to-r from-[#f8b195] to-[#f67280] hover:opacity-90 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                새 게시글
            </button>
            <button onclick="app.toggleDarkMode()" id="themeToggleBtn" class="p-2.5 bg-white dark:bg-[#21252b] hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg transition border border-[#f0e6ed] dark:border-gray-700 shadow-sm" title="테마 전환"></button>
            
            <button onclick="app.connectFile()" id="connectFileBtn" class="flex items-center gap-1.5 px-3.5 py-2 bg-[#b8e0d2]/40 dark:bg-emerald-900/30 hover:bg-[#b8e0d2] text-[#2c5446] dark:text-emerald-300 rounded-lg text-sm font-medium transition border border-[#b8e0d2] dark:border-emerald-800" title="컴퓨터의 .json 파일과 직접 연결">📁 파일 연결</button>
            <button onclick="app.saveToFile()" id="saveFileBtn" class="flex items-center gap-1.5 px-3.5 py-2 bg-[#e2d4f0]/40 dark:bg-purple-900/30 hover:bg-[#e2d4f0] text-[#4a3d54] dark:text-purple-300 rounded-lg text-sm font-medium transition border border-[#e2d4f0] dark:border-purple-800 hidden" title="연결된 파일에 즉시 저장">💾 파일 저장</button>
            
            <button onclick="app.downloadJSON()" class="flex items-center gap-1.5 px-3 py-2 bg-white dark:bg-[#21252b] hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-sm font-medium transition border border-[#f0e6ed] dark:border-gray-700 shadow-sm">JSON 다운</button>
            <label class="flex items-center gap-1.5 px-3 py-2 bg-white dark:bg-[#21252b] hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg text-sm font-medium transition border border-[#f0e6ed] dark:border-gray-700 cursor-pointer shadow-sm">
                JSON 복원
                <input type="file" accept=".json" onchange="app.restoreJSON(event)" class="hidden">
            </label>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col relative">
        <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>
        <div id="appView" class="flex-1 flex flex-col">
            <div class="flex items-center justify-center h-64 text-gray-400">데이터를 불러오는 중입니다...</div>
        </div>

        <div class="fixed right-8 bottom-8 z-40 flex flex-col gap-2 shadow-xl">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="w-10 h-10 rounded-full bg-[#3d3b40]/80 dark:bg-gray-700/80 text-white flex items-center justify-center hover:bg-[#f8b195] transition" title="맨 위로">▲</button>
            <button onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})" class="w-10 h-10 rounded-full bg-[#3d3b40]/80 dark:bg-gray-700/80 text-white flex items-center justify-center hover:bg-[#f8b195] transition" title="맨 아래로">▼</button>
        </div>
    </main>

    <div id="modalOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div id="modalContent" class="pastel-panel rounded-2xl w-full max-w-5xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden transform transition-all text-[#3d3b40] dark:text-gray-100"></div>
    </div>

    <!-- 외부 자바스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
