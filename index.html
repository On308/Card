<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Archive</title>

    <!-- 테마 FOUC 방지: CSS보다 먼저 실행 -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('novel_archive_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
	
    <!-- 폰트: preconnect + 초기 필수 폰트만 (나머지는 JS가 lazy load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand" onclick="app.goToList()">
            <div class="brand-icon">N</div>
            <h1 class="brand-name">
                Novel Archive
                <span class="version-badge">v3.0</span>
            </h1>
        </div>

        <div class="header-actions">
            <button onclick="app.openNewPostModal()" class="btn btn-primary">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                새 게시글
            </button>

            <button onclick="app.toggleDarkMode()" id="themeToggleBtn" class="btn-icon" title="테마 전환"></button>

            <button onclick="app.connectFile()" id="connectFileBtn" class="btn btn-success">
                📁 파일 연결
            </button>
            <button onclick="app.saveToFile()" id="saveFileBtn" class="btn btn-purple hidden" title="연결된 파일에 즉시 저장">
                💾 파일 저장
            </button>

            <button onclick="app.downloadJSON()" class="btn btn-soft">JSON 다운</button>

            <label class="btn btn-soft btn-file-label">
                JSON 복원
                <input type="file" accept=".json" onchange="app.restoreJSON(event)" hidden>
            </label>
        </div>
    </header>

    <main class="app-main">
        <div id="toastContainer" class="toast-container"></div>
        <div id="appView" class="app-view">
            <div class="view-loading">데이터를 불러오는 중입니다...</div>
        </div>
    </main>

    <div class="scroll-buttons">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="scroll-btn" title="맨 위로">▲</button>
        <button onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})" class="scroll-btn" title="맨 아래로">▼</button>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div id="modalContent" class="modal"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
